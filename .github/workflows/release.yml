name: Release builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: HitmanPatchChanger.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: HitmanPatchChanger
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o artifacts/${{ matrix.rid }}

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path artifacts/${{ matrix.rid }}/${{ matrix.binary }} -DestinationPath HitmanPatchChanger-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x artifacts/${{ matrix.rid }}/${{ matrix.binary }}
          zip -j HitmanPatchChanger-${{ matrix.rid }}.zip artifacts/${{ matrix.rid }}/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: HitmanPatchChanger-${{ matrix.rid }}
          path: HitmanPatchChanger-${{ matrix.rid }}.zip
